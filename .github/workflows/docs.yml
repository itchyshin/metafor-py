name: Build documentation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "COVERAGE.md"
      - "LICENSE"
      - "COMPATIBILITY.md"
      - "docs/**"
      - "examples/**"
      - "reference/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs,tables]"
      - name: Build Sphinx site
        run: python -m sphinx -W --keep-going -b html docs _site
