[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metafor-py"
version = "0.1.0"
description = "Native Python tools for meta-analysis"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
authors = [
    {name = "Shinichi Nakagawa"},
    {name = "Yefeng Yang"},
    {name = "Wolfgang Viechtbauer"},
]
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.urls]
Documentation = "https://itchyshin.github.io/metafor-py/"
Repository = "https://github.com/itchyshin/metafor-py"

[project.optional-dependencies]
test = ["pytest>=8", "pandas>=2", "patsy>=0.5"]
tables = ["pandas>=2", "patsy>=0.5"]
plot = ["matplotlib>=3.8"]
docs = ["sphinx>=7", "myst-parser>=3", "sphinx-rtd-theme>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
  "bcg_models: BCG effects, model estimates, inference, and predictions",
  "bcg_edges: BCG missing, zero-cell, validation, and boundary cases",
  "bcg_adapters: BCG design and forest-data row alignment",
  "dependent_gls: supplied correlated sampling covariance",
  "dependent_nested: nested random effects",
  "dependent_un: two-outcome unstructured effects",
  "phylogeny_model: supplied phylogenetic correlation model",
  "phylogeny_edges: phylogenetic boundary and alignment cases",
]

[tool.sphinx]
